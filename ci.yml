name: CI

on:
  push:
  pull_request:

jobs:
  structural-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run structural tests
        run: python -m unittest discover -s tests -v
